name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases so two rapid merges cannot race to publish the same commit.
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish catalog changes
    # The push trigger is restricted to main, but workflow_dispatch can run
    # from another ref. Releases only represent changes that landed on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets the workflow compare the current catalog inputs
          # with the latest catalog release and generate release notes.
          fetch-depth: 0

      - name: Validate plugins and generated mirrors
        run: |
          bin/validate-json
          bin/validate-plugins
          bin/build-codex-marketplace
          bin/build-opencode-mirror
          # `git diff` ignores untracked files, so use git status to catch an
          # untracked generated mirror as well.
          drift="$(git status --porcelain dist/ .agents/)"
          if [[ -n "${drift}" ]]; then
            echo "::error::Generated mirrors are out of date; run make build"
            printf '%s\n' "${drift}"
            exit 1
          fi

      - name: Check for catalog changes
        id: changes
        run: |
          latest_tag="$(git tag --list 'catalog-*' --sort=-creatordate | head -1)"
          if [[ -z "${latest_tag}" ]] || [[ "${latest_tag}" == "catalog-${GITHUB_SHA}" ]] || ! git diff --quiet "${latest_tag}" -- plugins/ .claude-plugin/marketplace.json; then
            if [[ -n "${latest_tag}" && "${latest_tag}" != "catalog-${GITHUB_SHA}" ]]; then
              changed_plugins="$(git diff --name-only "${latest_tag}" -- plugins/ | awk -F/ 'NF >= 2 { print $2 }' | sort -u)"
              while IFS= read -r plugin; do
                [[ -z "${plugin}" ]] && continue
                manifest="plugins/${plugin}/.claude-plugin/plugin.json"
                previous_version="$(git show "${latest_tag}:${manifest}" 2>/dev/null | jq -r '.version // empty')"
                current_version="$(jq -r '.version // empty' "${manifest}")"
                [[ -z "${previous_version}" ]] && continue
                IFS=. read -r previous_major previous_minor previous_patch <<< "${previous_version}"
                IFS=. read -r current_major current_minor current_patch <<< "${current_version}"
                previous_key="$(printf '%09d%09d%09d' "${previous_major}" "${previous_minor}" "${previous_patch}")"
                current_key="$(printf '%09d%09d%09d' "${current_major}" "${current_minor}" "${current_patch}")"
                if [[ "${current_key}" < "${previous_key}" || "${current_key}" == "${previous_key}" ]]; then
                  echo "::error::${plugin} changed without a forward manifest version bump (${previous_version} -> ${current_version})."
                  exit 1
                fi
              done <<< "${changed_plugins}"
            fi
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Plugin or catalog metadata changed since ${latest_tag:-the first catalog release}."
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No plugin or catalog metadata changes since ${latest_tag}; skipping release."
          fi

      - name: Set catalog tag
        if: steps.changes.outputs.changed == 'true'
        id: tag
        run: |
          tag="catalog-${GITHUB_SHA}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Catalog tag: ${tag}"

      - name: Check whether tag and release already exist
        if: steps.changes.outputs.changed == 'true'
        id: check
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          function release_exists() {
            local tag="${1}"
            local output

            if output="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --silent 2>&1)"; then
              return 0
            fi

            if [[ "${output}" == *"HTTP 404"* ]]; then
              return 1
            fi

            echo "::error::Failed to determine whether GitHub Release ${tag} exists." >&2
            printf '%s\n' "${output}" >&2
            return 2
          }

          remote_commit="$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)"
          if [[ -z "${remote_commit}" ]]; then
            remote_commit="$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)"
          fi

          if [[ -z "${remote_commit}" ]]; then
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          elif [[ "${remote_commit}" == "${GITHUB_SHA}" ]]; then
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Catalog tag ${TAG} exists at ${remote_commit}, not ${GITHUB_SHA}." >&2
            exit 1
          fi

          if release_exists "${TAG}"; then
            if [[ -z "${remote_commit}" ]]; then
              echo "::error::GitHub Release ${TAG} exists, but its tag is missing on origin." >&2
              exit 1
            fi
            echo "release_exists=true" >> "${GITHUB_OUTPUT}"
          else
            release_status="${?}"
            case "${release_status}" in
              1) echo "release_exists=false" >> "${GITHUB_OUTPUT}" ;;
              *) exit "${release_status}" ;;
            esac
          fi

      - name: Create and push annotated tag
        if: steps.changes.outputs.changed == 'true' && steps.check.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        if: steps.changes.outputs.changed == 'true' && steps.check.outputs.release_exists == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "Marketplace ${TAG}" \
            --generate-notes \
            --verify-tag
