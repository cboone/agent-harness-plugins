name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases so two rapid merges cannot race to publish the same commit.
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish catalog changes
    # The push trigger is restricted to main, but workflow_dispatch can run
    # from another ref. Releases only represent changes that landed on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets the workflow compare the current catalog inputs
          # with the latest catalog release and generate release notes.
          fetch-depth: 0

      - name: Validate plugins and generated mirrors
        run: |
          bin/validate-json
          bin/validate-plugins
          bin/build-codex-marketplace
          bin/build-opencode-mirror
          # `git diff` ignores untracked files, so use git status to catch an
          # untracked generated mirror as well.
          drift="$(git status --porcelain dist/ .agents/)"
          if [[ -n "${drift}" ]]; then
            echo "::error::Generated mirrors are out of date; run make build"
            printf '%s\n' "${drift}"
            exit 1
          fi

      - name: Check for catalog changes
        id: changes
        run: |
          latest_tag="$(git tag --list 'catalog-*' --sort=-creatordate | head -1)"
          # Include current and previous registrations so removed sources count.
          catalogs="$(cat .claude-plugin/marketplace.json)"
          if [[ -n "${latest_tag}" ]]; then
            catalogs+=$'\n'
            catalogs+="$(git show "${latest_tag}:.claude-plugin/marketplace.json")"
          fi
          sources="$(printf '%s\n' "${catalogs}" | jq -sr '
            [.[].plugins[].source | select(type == "string" and startswith("./"))] | unique[]')"
          catalog_paths=(.claude-plugin/marketplace.json)
          while IFS= read -r source; do
            [[ -z "${source}" ]] && continue
            catalog_paths+=(":(literal)${source%/}/")
          done <<< "${sources}"
          if [[ -z "${latest_tag}" ]] || [[ "${latest_tag}" == "catalog-${GITHUB_SHA}" ]] || ! git diff --quiet "${latest_tag}" -- "${catalog_paths[@]}"; then
            if [[ -n "${latest_tag}" && "${latest_tag}" != "catalog-${GITHUB_SHA}" ]]; then
              while IFS= read -r source; do
                [[ -z "${source}" ]] && continue
                git diff --quiet "${latest_tag}" -- ":(literal)${source%/}/" && continue
                manifest="${source#./}/.claude-plugin/plugin.json"
                if [[ ! -f "${manifest}" ]]; then
                  continue
                fi
                current_version="$(jq -r '.version // empty' "${manifest}")"
                if ! git cat-file -e "${latest_tag}:${manifest}" 2>/dev/null; then
                  if [[ "${current_version}" != '1.0.0' ]]; then
                    echo "::error::${source} is newly registered and must start at manifest version 1.0.0 (found ${current_version:-missing})."
                    exit 1
                  fi
                  continue
                fi
                previous_version="$(git show "${latest_tag}:${manifest}" 2>/dev/null | jq -r '.version // empty')"
                [[ -z "${previous_version}" ]] && continue
                # Digit length and lexical order compare unbounded integers.
                if ! jq -en --arg current "${current_version}" --arg previous "${previous_version}" \
                  'def key: split(".") | map([length, .]); ($current | key) > ($previous | key)' > /dev/null; then
                  echo "::error::${source} changed without a forward manifest version bump (${previous_version} -> ${current_version})."
                  exit 1
                fi
              done <<< "${sources}"
            fi
            {
              echo "changed=true"
              echo "tag=catalog-${GITHUB_SHA}"
              echo "commit=${GITHUB_SHA}"
            } >> "${GITHUB_OUTPUT}"
            echo "Plugin or catalog metadata changed since ${latest_tag:-the first catalog release}."
          else
            {
              echo "changed=false"
              echo "tag=${latest_tag}"
              echo "commit=$(git rev-list -1 "${latest_tag}")"
            } >> "${GITHUB_OUTPUT}"
            echo "No new catalog inputs; checking publication recovery for ${latest_tag}."
          fi

      - name: Check whether tag and release already exist
        id: check
        env:
          TAG: ${{ steps.changes.outputs.tag }}
          COMMIT: ${{ steps.changes.outputs.commit }}
          CHANGED: ${{ steps.changes.outputs.changed }}
        run: |
          function release_exists() {
            local tag="${1}"
            local output

            if output="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --silent 2>&1)"; then
              return 0
            fi

            if [[ "${output}" == *"HTTP 404"* ]]; then
              return 1
            fi

            echo "::error::Failed to determine whether GitHub Release ${tag} exists." >&2
            printf '%s\n' "${output}" >&2
            return 2
          }

          remote_commit="$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)"
          if [[ -z "${remote_commit}" ]]; then
            remote_commit="$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)"
          fi

          if [[ -z "${remote_commit}" ]]; then
            if [[ "${CHANGED}" != "true" ]]; then
              echo "::error::Recovery tag ${TAG} is missing on origin." >&2
              exit 1
            fi
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          elif [[ "${remote_commit}" == "${COMMIT}" ]]; then
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Catalog tag ${TAG} exists at ${remote_commit}, not ${COMMIT}." >&2
            exit 1
          fi

          if release_exists "${TAG}"; then
            if [[ -z "${remote_commit}" ]]; then
              echo "::error::GitHub Release ${TAG} exists, but its tag is missing on origin." >&2
              exit 1
            fi
            echo "release_exists=true" >> "${GITHUB_OUTPUT}"
          else
            release_status="${?}"
            case "${release_status}" in
              1) echo "release_exists=false" >> "${GITHUB_OUTPUT}" ;;
              *) exit "${release_status}" ;;
            esac
          fi

      - name: Create and push annotated tag
        if: steps.changes.outputs.changed == 'true' && steps.check.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.changes.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        if: steps.check.outputs.release_exists == 'false'
        env:
          TAG: ${{ steps.changes.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "Marketplace ${TAG}" \
            --generate-notes \
            --verify-tag
