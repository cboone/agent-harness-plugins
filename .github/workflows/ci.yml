name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: "yarn"
      - run: yarn install --immutable
      - name: Lint Markdown
        run: yarn lint
      # ubuntu-latest ships whatever ShellCheck its image happens to carry, so a
      # runner bump can add or drop diagnostics with no change in this
      # repository. The action pins 0.11.0 by default and checks the release
      # archive against SHA-256 digests committed alongside it, which the
      # `curl | tar` step this replaces did not do: curl sat in a non-final
      # pipeline stage under a shell without pipefail, so a failed download was
      # caught only when tar happened to choke on the truncated stream.
      - name: Set up ShellCheck
        uses: cboone/gh-actions/actions/set-up-shellcheck@3c9adb5a8b166444d3c0e3fe606d55f0dc7ac726 # v5.0.0
      - name: Set up shfmt
        uses: cboone/gh-actions/actions/set-up-shfmt@3c9adb5a8b166444d3c0e3fe606d55f0dc7ac726 # v5.0.0
      # Runs at ShellCheck's default severity, so the optional checks enabled in
      # .shellcheckrc are actually enforced, and covers every Bash script in the
      # repository via bin/list-shell-scripts rather than a fixed glob.
      - name: ShellCheck and shfmt
        run: make lint-shell
      - uses: cboone/gh-actions/actions/set-up-actionlint@3c9adb5a8b166444d3c0e3fe606d55f0dc7ac726 # v5.0.0
      - name: Actionlint
        run: actionlint
      - name: Validate JSON syntax
        run: bin/validate-json
      - name: Validate plugin structure
        run: bin/validate-plugins
      - name: Validate generated mirrors are up to date
        run: |
          bin/build-review-checklists
          bin/build-codex-marketplace
          bin/build-opencode-mirror
          # `git diff` compares the worktree to the index and ignores untracked
          # files, so a newly added plugin skill produced a brand-new untracked
          # symlink under dist/opencode/skills/ and still reported clean.
          # `git status --porcelain` catches additions as well as edits.
          drift="$(git status --porcelain dist/ .agents/ plugins/set-up-review-config/skills/set-up-review-config/references/checklists/)"
          if [[ -n "${drift}" ]]; then
            echo "::error::Generated files are out of date; run make build"
            printf '%s\n' "${drift}"
            exit 1
          fi

  # Each scrut document runs as its own job, so the suite takes as long as its
  # slowest document, plus per-job setup, rather than the sum of all of them.
  # The list is read from the tree, so a new document joins the matrix without
  # anyone registering it. scrut test recurses into directories and reads
  # Markdown (*.md, *.markdown, *.scrut) and Cram (*.t, *.cram) documents, and
  # this search lists the same files under tests/scrut/. The step sets bash
  # explicitly for pipefail, so a find that fails partway fails the job rather
  # than shortening the matrix.
  scrut-documents:
    name: List scrut documents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documents: ${{ steps.list.outputs.documents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        shell: bash
        run: |
          documents="$(find tests/scrut \( -type f -o -type l \) \( -name '*.md' -o -name '*.markdown' -o -name '*.scrut' -o -name '*.t' -o -name '*.cram' \) | sort | jq -Rcs 'split("\n") | map(select(length > 0))')"
          if [[ "${documents}" == "[]" ]]; then
            echo "::error::No scrut documents found under tests/scrut/"
            exit 1
          fi
          echo "documents=${documents}" >> "${GITHUB_OUTPUT}"

  test-scrut:
    name: Scrut tests
    needs: scrut-documents
    strategy:
      fail-fast: false
      matrix:
        document: ${{ fromJSON(needs.scrut-documents.outputs.documents) }}
    uses: cboone/gh-actions/.github/workflows/run-scrut-tests.yml@3c9adb5a8b166444d3c0e3fe606d55f0dc7ac726 # v5.0.0
    # Every scrut-env path below must start with "./". scrut runs each testcase
    # from a temporary directory, and the reusable workflow rewrites only values
    # matching ./* into absolute paths before exporting them. A bare "." is left
    # untouched, so REPO_ROOT=. pointed at that temp dir: binaries still ran, but
    # `cd "${REPO_ROOT}"` landed nowhere useful and the repository-wide grep
    # guards scanned an empty directory and passed without checking anything.
    #
    # scrut-env is a literal block whose every line is parsed as KEY=value, and a
    # comment inside it fails the job, which is why this note lives out here.
    with:
      scrut-env: |
        CHECK_CROSS_REFERENCES_BIN=./bin/check-cross-references
        BUILD_REVIEW_CHECKLISTS_BIN=./bin/build-review-checklists
        REVIEW_CHECKLIST_FIXTURE_BIN=./tests/fixtures/review-checklist-fixture
        BUILD_CODEX_MARKETPLACE_BIN=./bin/build-codex-marketplace
        CODEX_TRANSLATION_FIXTURE_BIN=./tests/fixtures/codex-translation-fixture
        COMPOSE_ISSUE_PROMPT_BIN=./plugins/address-issue-in-worktree/scripts/compose-issue-prompt
        CREATE_WORKTREE_COMPOSE_ISSUE_PROMPT_BIN=./plugins/create-worktree/scripts/compose-issue-prompt
        COPILOT_REVIEW_DATA_DIR=./tests/data/copilot-reviews
        COPILOT_AUDIT_DATA_DIR=./tests/data/copilot-audit
        COPILOT_CANARY_DATA_DIR=./tests/data/copilot-canary
        COPILOT_REVIEW_CANARY_BIN=./bin/copilot-review-canary
        COPILOT_GH_STUB_BIN=./tests/fixtures/copilot-gh-stub
        COPILOT_GH_DATA_DIR=./tests/data/copilot-gh
        CROSS_REFERENCE_FIXTURE_BIN=./tests/fixtures/cross-reference-fixture
        CATALOG_RELEASE_FIXTURE_BIN=./tests/fixtures/catalog-release-fixture
        VALIDATE_PLUGIN_FIXTURE_BIN=./tests/fixtures/validate-plugin-fixture
        LIST_SHELL_SCRIPTS_BIN=./bin/list-shell-scripts
        MATERIALIZE_CASE_BIN=./bin/materialize-case
        VALIDATE_CORPUS_BIN=./bin/validate-corpus
        REVIEW_CORPUS_FIXTURE_BIN=./tests/fixtures/review-corpus-fixture
        REPO_ROOT=./
        CREATE_WORKTREE_LAUNCH_WORKMUX_BIN=./plugins/create-worktree/scripts/launch-workmux
        ADDRESS_ISSUE_IN_WORKTREE_LAUNCH_WORKMUX_BIN=./plugins/address-issue-in-worktree/scripts/launch-workmux
        DEPENDABOT_PRS_BIN=./plugins/triage-dependabot-prs/scripts/dependabot-prs
        DEPENDABOT_PRS_DATA_DIR=./tests/data/dependabot-prs
        GH_STUB_BIN=./tests/fixtures/gh-stub
        GIT_WORKTREE_STUB_BIN=./tests/fixtures/git-worktree-stub
        MANAGE_RESOURCE_CLAIMS_BIN=./plugins/address-issue-in-worktree/scripts/manage-resource-claims
        CREATE_WORKTREE_MANAGE_RESOURCE_CLAIMS_BIN=./plugins/create-worktree/scripts/manage-resource-claims
        REPORT_BOARD_BIN=./plugins/publish-report-board/scripts/report-board
        REPORT_BOARD_DATA_DIR=./tests/data/report-board
        BUGS_GATHER_BIN=./plugins/publish-report-board/scripts/bugs-gather
        BUGS_GATHER_DATA_DIR=./tests/data/bugs-gather
        CURL_STUB_BIN=./tests/fixtures/curl-stub
        RESOLVE_COPILOT_THREADS_BIN=./plugins/resolve-copilot-pr-feedback/scripts/resolve-copilot-threads
        MONITOR_PR_RESOLVE_COPILOT_THREADS_BIN=./plugins/monitor-pr/scripts/resolve-copilot-threads
        REVIEW_SCOPE_BIN=./plugins/review-until-clean/scripts/review-scope
        GIT_CONFIG_GLOBAL=/dev/null
        GIT_CONFIG_SYSTEM=/dev/null
        TMUX_STUB_BIN=./tests/fixtures/tmux-stub
        NOTIFY_BIN=./plugins/notify/scripts/notify
        CHECK_NOTIFICATIONS_BIN=./tests/fixtures/check-notifications
        UNIX_SOCKET_FIXTURE_BIN=./tests/fixtures/create-unix-socket
        WORKMUX_STUB_BIN=./tests/fixtures/workmux-stub
      # bin/validate-corpus converts each defects.yaml through yq, which the
      # ubuntu runner image ships. Asserting it beats installing an unpinned
      # copy: an image that drops it, or swaps in python-yq with jq's flags,
      # fails here with a clear message rather than as a scrut output diff.
      scrut-setup-cmd: "yq --version | grep -q mikefarah"
      scrut-test-dir: ${{ matrix.document }}
      # The budget: every document's job finishes within half of this ceiling.
      # When one outgrows that, cut its runtime or split it; do not raise the
      # ceiling. tests/AGENTS.md says how to measure a document and where the
      # time usually goes.
      timeout-minutes: 10
