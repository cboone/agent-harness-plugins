name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      - run: yarn install --immutable
      - name: Lint Markdown
        run: yarn lint
      - name: ShellCheck
        run: shellcheck -S warning bin/* plugins/*/scripts/*
      - name: Set up shfmt
        uses: cboone/gh-actions/actions/setup-shfmt@main
      - name: shfmt
        run: shfmt -d bin/* plugins/*/scripts/*
      - uses: cboone/gh-actions/actions/setup-actionlint@main
      - name: Actionlint
        run: actionlint
      - name: Validate JSON syntax
        run: bin/validate-json
      - name: Validate plugin structure
        run: bin/validate-plugins
