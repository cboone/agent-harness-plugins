name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ubuntu-latest ships whatever ShellCheck its image happens to carry, so a
  # runner bump can add or drop diagnostics with no change in this repository.
  # Pin it like every other tool here.
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  ci:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".tool-versions"
          cache: "yarn"
      - run: yarn install --immutable
      - name: Lint Markdown
        run: yarn lint
      - name: Set up ShellCheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Set up shfmt
        uses: cboone/gh-actions/actions/set-up-shfmt@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0
      # Runs at ShellCheck's default severity, so the optional checks enabled in
      # .shellcheckrc are actually enforced, and covers every Bash script in the
      # repository via bin/list-shell-scripts rather than a fixed glob.
      - name: ShellCheck and shfmt
        run: make lint-shell
      - uses: cboone/gh-actions/actions/set-up-actionlint@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0
      - name: Actionlint
        run: actionlint
      - name: Validate JSON syntax
        run: bin/validate-json
      - name: Validate plugin structure
        run: bin/validate-plugins
      - name: Validate generated mirrors are up to date
        run: |
          bin/build-codex-marketplace
          bin/build-opencode-mirror
          # `git diff` compares the worktree to the index and ignores untracked
          # files, so a newly added plugin skill produced a brand-new untracked
          # symlink under dist/opencode/skills/ and still reported clean.
          # `git status --porcelain` catches additions as well as edits.
          drift="$(git status --porcelain dist/ .agents/)"
          if [[ -n "${drift}" ]]; then
            echo "::error::Generated mirrors are out of date; run bin/build-codex-marketplace and bin/build-opencode-mirror"
            printf '%s\n' "${drift}"
            exit 1
          fi

  test-scrut:
    name: Scrut tests
    uses: cboone/gh-actions/.github/workflows/run-scrut-tests.yml@91f9abd25d4f82354c0f950dfc8b6d7525b0f5b5 # v3.0.0
    # scrut-env below is a literal block: every line is parsed as KEY=value and a
    # comment inside it is rejected, so the explanation lives out here.
    #
    # COMPUTE_CATALOG_STATE_BIN, LIST_SHELL_SCRIPTS_BIN and REPO_ROOT are
    # absolute while the entries around them are relative. scrut runs each
    # testcase from a temporary directory, so a relative path resolves against
    # that temp dir rather than the checkout. The repo-tooling suite both invokes
    # those binaries and cds to REPO_ROOT for repository-wide grep guards; a
    # relative value left the guards scanning an empty directory and passing
    # without checking anything.
    with:
      scrut-env: |
        COMPOSE_ISSUE_PROMPT_BIN=./plugins/create-worktree-from-issue/scripts/compose-issue-prompt
        COPILOT_REVIEW_DATA_DIR=./tests/data/copilot-reviews
        COMPUTE_CATALOG_STATE_BIN=${{ github.workspace }}/bin/compute-catalog-state
        LIST_SHELL_SCRIPTS_BIN=${{ github.workspace }}/bin/list-shell-scripts
        REPO_ROOT=${{ github.workspace }}
        CREATE_WORKTREE_LAUNCH_WORKMUX_BIN=./plugins/create-worktree/scripts/launch-workmux
        CREATE_WORKTREE_FROM_ISSUE_LAUNCH_WORKMUX_BIN=./plugins/create-worktree-from-issue/scripts/launch-workmux
        GIT_WORKTREE_STUB_BIN=./tests/fixtures/git-worktree-stub
        RESOLVE_COPILOT_THREADS_BIN=./plugins/resolve-copilot-pr-feedback/scripts/resolve-copilot-threads
        TMUX_STUB_BIN=./tests/fixtures/tmux-stub
        UNIX_SOCKET_FIXTURE_BIN=./tests/fixtures/create-unix-socket
        WORKMUX_STUB_BIN=./tests/fixtures/workmux-stub
      scrut-test-dir: "tests/scrut/"
