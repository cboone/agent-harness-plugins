name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".tool-versions"
          cache: "yarn"
      - run: yarn install --immutable
      - name: Lint Markdown
        run: yarn lint
      - name: ShellCheck
        run: shellcheck -S warning bin/* plugins/*/scripts/*
      - name: Set up shfmt
        uses: cboone/gh-actions/actions/setup-shfmt@f69487c36f4e217afe28ea631de39edf17d35238 # v2.1.4
      - name: shfmt
        run: shfmt -d bin/* plugins/*/scripts/*
      - uses: cboone/gh-actions/actions/setup-actionlint@f69487c36f4e217afe28ea631de39edf17d35238 # v2.1.4
      - name: Actionlint
        run: actionlint
      - name: Validate JSON syntax
        run: bin/validate-json
      - name: Validate plugin structure
        run: bin/validate-plugins
      - name: Validate OpenCode mirror is up to date
        run: |
          bin/build-opencode-mirror
          git diff --exit-code dist/
