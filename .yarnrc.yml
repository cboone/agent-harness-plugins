# Security-strict explicit settings. Yarn 4 defaults already match
# enableScripts/enableTelemetry; making them explicit prevents drift on
# future Corepack migrations. defaultSemverRangePrefix is changed from
# the default "^" so `yarn add` pins exact versions by default.
#
# npmMinimalAgeGate is deliberately NOT set here. `corepack use` wrote it as 0
# during the Yarn 4.18 bump, which disables the gate; the Yarn default is 1d,
# refusing packages published in the last day as a supply-chain mitigation.
# Taking the default keeps the protection.
defaultSemverRangePrefix: ""
enableScripts: false
enableTelemetry: false

nodeLinker: node-modules
