# Security-strict explicit settings. Yarn 4 defaults already match
# enableScripts/enableTelemetry; making them explicit prevents drift on
# future Corepack migrations. defaultSemverRangePrefix is changed from
# the default "^" so `yarn add` pins exact versions by default.
defaultSemverRangePrefix: ""
enableScripts: false
enableTelemetry: false

nodeLinker: node-modules
