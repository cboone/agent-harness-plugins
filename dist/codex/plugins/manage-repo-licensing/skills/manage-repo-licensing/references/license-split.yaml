# SPDX-FileCopyrightText: 2026 Christopher Boone
# SPDX-License-Identifier: CC-BY-4.0
#
# Default license split proposed by `manage-repo-licensing`. Every repo
# confirms or overrides this during policy freeze. Buckets are added
# only when the repo actually contains the matching content.
#
# Note on placement: most buckets are applied via REUSE.toml annotation
# groups, not inline or per-file sidecars. Inline headers are reserved
# for substantive hand-authored source code; sidecars for the narrow
# case of binary or non-commentable files that carry per-file
# metadata. See references/file-type-matrix.md.

buckets:
  lean_code:
    spdx: Apache-2.0
    placement: inline
    matches:
      - "**/*.lean"
    rationale: >-
      Lean 4 sources inherit Mathlib's Apache-2.0 licensing by convention.
      Inline `/- ... -/` header travels with the file so a consumer who
      lifts a module elsewhere sees the SPDX tag on it.

  non_lean_substantive_code:
    spdx: MIT
    placement: inline
    matches:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.go"
      - "**/*.rs"
      - "**/*.lua"
      - "**/*.sh"
      - "**/*.zsh"
      - "papers/shared/macros.tex"
      - "papers/shared/filters/*.lua"
      - "papers/**/figures/generate.py"
    rationale: >-
      Permissive copy/modify/redistribute terms for source files whose
      SPDX tag should travel with the file. Omit this bucket when the
      repo has no non-Lean substantive code (for example, a Lean-only
      proof repo).

  infrastructure_config:
    spdx: MIT # or Apache-2.0 when repo has no MIT bucket
    placement: reuse_toml_config_group
    matches:
      - "Makefile"
      - "**/*.mk"
      - "**/*.toml"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.jsonc"
      - ".editorconfig"
      - ".gitignore"
      - ".gitattributes"
      - ".ignore"
      - "cspell-words.txt"
      - "REUSE.toml"
    rationale: >-
      Hand-authored infrastructure config: tells tools what to do.
      Content is functional, not substantive source code. The SPDX tag
      is not part of the file's public interface, so it lives in
      REUSE.toml rather than cluttering every config file or spawning
      a .license sidecar for every lint-configuration dotfile.

  prose_and_exposition:
    spdx: CC-BY-4.0
    placement: reuse_toml_prose_group
    matches:
      - "**/*.md" # project-authored only; LicenseRef-Reference-Material overrides for bundled third-party
      - "**/*.bib"
      - "NOTICE"
    rationale: >-
      Human-authored exposition — framework docs, planning, papers,
      explainers, READMEs, and the NOTICE summary itself.

  generated_artifacts:
    spdx: CC0-1.0
    placement: reuse_toml_generated_group
    matches:
      - "**/lake-manifest.json"
      - "uv.lock"
      - "poetry.lock"
      - "package-lock.json"
      - "yarn.lock"
      - "**/lean-toolchain"
      - "papers/*/main.tex"
      - "papers/submission-schedule.ics"
      - "references/cross-reference-*.json"
      - "references/cross-reference-frequency.md"
    rationale: >-
      Files auto-regenerated by tooling whose content is mechanical
      (hashes, pinned versions, Pandoc output). CC0-1.0 is a public-
      domain dedication: the honest framing is that the project does
      not assert copyright over content it did not originate. Adds
      LICENSES/CC0-1.0.txt to the repo. Omit this bucket when the repo
      has no tracked generated artifacts.

  structural_placeholders:
    spdx: MIT # or Apache-2.0 when repo has no MIT bucket
    placement: reuse_toml_structural_group
    matches:
      - "**/.gitkeep"
    rationale: >-
      Zero-byte directory-scaffolding files. One glob annotation under
      the repo's code-bucket license eliminates per-file sidecars.

  contributor_covenant_coc:
    spdx: CC-BY-SA-4.0
    placement: reuse_toml_coc_block
    matches:
      - "CODE_OF_CONDUCT.md"
    rationale: >-
      Contributor Covenant and its derivatives are released under
      CC-BY-SA-4.0. Include only when the repo ships a Contributor-
      Covenant-derived CoC.

  third_party_reference_material:
    spdx: LicenseRef-Reference-Material
    placement: scale_tiered # per-file sidecars for small collections; REUSE.toml glob for large
    matches:
      - "references/papers/**"
      - "references/extractions/**"
      - "references/transcriptions/**"
    rationale: >-
      Bundled third-party PDFs, publisher HTML snapshots, verbatim
      transcriptions, and faithful OCR caches. Copyright stays with
      the original authors and publishers. Small collections (~20 or
      fewer files) use per-file sidecars that carry actual author and
      publisher lines; larger collections use a single REUSE.toml
      annotation block.

  per_work_licenseref:
    spdx: "LicenseRef-<Work-Specific>"
    placement: per_work_sidecar_or_reuse_block
    matches: []
    rationale: >-
      Allowed only when a single work has unusual prominence AND its
      LicenseRef text needs wording beyond the shared
      LicenseRef-Reference-Material. Every exception must be justified
      in NOTICE.

# Inline vs REUSE.toml, restated:
#
# Use inline headers for files where the SPDX tag is part of the
# file's public interface — substantive hand-authored source code
# someone might lift elsewhere and read the header on.
#
# Use REUSE.toml for ceremonial coverage where the SPDX tag is not
# load-bearing: prose (covered as a prose group), config (config
# group), generated artifacts (generated group with CC0), placeholders
# (structural group), and reference material (reference-material
# group).
#
# Use per-file sidecars only for the narrow residual case: individual
# bundled reference PDFs under the small-collection threshold, or
# binary assets with distinct per-file attribution.
