# One page of a GitHub search for bug issues. gh api graphql --paginate
# supplies $endCursor. Pages hold 25 issues because each carries its recent
# comments, the pull requests that close it, including through a manual link,
# with their check, review, and merge state, and the pull requests that
# cross-reference it, which can merge without closing it.
query ($q: String!, $endCursor: String) {
  search(query: $q, type: ISSUE, first: 25, after: $endCursor) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      __typename
      ... on Issue {
        number
        title
        url
        state
        stateReason
        createdAt
        updatedAt
        closedAt
        author {
          __typename
          login
        }
        authorAssociation
        assignees(first: 10) {
          pageInfo {
            hasNextPage
          }
          nodes {
            login
          }
        }
        labels(first: 30) {
          pageInfo {
            hasNextPage
          }
          nodes {
            name
          }
        }
        issueType {
          name
        }
        reactions {
          totalCount
        }
        comments(last: 30) {
          totalCount
          nodes {
            author {
              __typename
              login
            }
            authorAssociation
            createdAt
          }
        }
        closedByPullRequestsReferences(first: 10, includeClosedPrs: true) {
          pageInfo {
            hasNextPage
          }
          nodes {
            number
            title
            url
            state
            isDraft
            createdAt
            updatedAt
            mergedAt
            mergeable
            mergeStateStatus
            headRefName
            reviewDecision
            reviewRequests(first: 1) {
              totalCount
            }
            latestReviews(last: 1) {
              nodes {
                submittedAt
              }
            }
            author {
              login
            }
            repository {
              nameWithOwner
            }
            commits(last: 1) {
              nodes {
                commit {
                  statusCheckRollup {
                    state
                  }
                }
              }
            }
          }
        }
        timelineItems(itemTypes: [CROSS_REFERENCED_EVENT], last: 20) {
          pageInfo {
            hasPreviousPage
          }
          nodes {
            __typename
            ... on CrossReferencedEvent {
              willCloseTarget
              source {
                ...LinkedPullRequest
              }
            }
          }
        }
      }
    }
  }
}

fragment LinkedPullRequest on ReferencedSubject {
  __typename
  ... on PullRequest {
    number
    url
    state
    mergedAt
    repository {
      nameWithOwner
    }
  }
}
