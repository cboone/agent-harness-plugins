# The ZenHub state of every bug. bugs-gather appends one aliased
# lookup per item after this file, such as
#   i0: issueByInfo(repositoryGhId: 106750406, issueNumber: 4034) { ...BugIssue }
# and closes the query. issueType is a union, so its name and level come
# through inline fragments; selecting them directly fails.
fragment BugIssue on Issue {
  estimate {
    value
  }
  pipelineIssue(workspaceId: $workspaceId) {
    latestTransferTime
    pipeline {
      name
    }
  }
  sprints(first: 10, workspaceId: $workspaceId) {
    nodes {
      id
    }
  }
  issueType {
    ... on GithubIssueType {
      name
      level
    }
    ... on ZenhubIssueType {
      name
      level
    }
  }
  blockingIssues(first: 20) {
    nodes {
      number
      state
      repository {
        name
      }
    }
  }
  blockedIssues(first: 20) {
    nodes {
      number
      state
      repository {
        name
      }
    }
  }
}

query ($workspaceId: ID!) {
  workspace(id: $workspaceId) {
    activeSprint {
      id
      name
      startAt
      endAt
    }
  }
