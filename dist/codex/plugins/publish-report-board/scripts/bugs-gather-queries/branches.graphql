# One page of a repository's branches, the most recently committed first, for
# the branch stage of the progress model. gh api graphql --paginate supplies
# $endCursor.
query ($owner: String!, $name: String!, $endCursor: String) {
  repository(owner: $owner, name: $name) {
    refs(refPrefix: "refs/heads/", first: 100, after: $endCursor, orderBy: { field: TAG_COMMIT_DATE, direction: DESC }) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        name
        target {
          ... on Commit {
            committedDate
          }
        }
      }
    }
  }
}
