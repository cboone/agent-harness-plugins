# The repository a bug board covers: its address, its numeric ID for ZenHub
# lookups, the default branch and commit the board records as synced, and its
# branches, the most recently committed first, for the branch stage of the
# progress model.
query ($owner: String!, $name: String!) {
  viewer {
    login
  }
  repository(owner: $owner, name: $name) {
    nameWithOwner
    url
    databaseId
    isArchived
    defaultBranchRef {
      name
      target {
        oid
      }
    }
    refs(refPrefix: "refs/heads/", first: 100, orderBy: { field: TAG_COMMIT_DATE, direction: DESC }) {
      pageInfo {
        hasNextPage
      }
      nodes {
        name
        target {
          ... on Commit {
            committedDate
          }
        }
      }
    }
  }
}
