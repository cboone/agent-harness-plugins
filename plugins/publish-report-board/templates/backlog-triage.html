<title>__BOARD_TITLE__</title>
<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
<style>
  /* The accent marks what is current or contended: segments that can run now
     and contention cells. Work in progress takes the stage colors instead.
     Tokens shared with bugs.html keep the same values; change both together. */
  :root {
    color-scheme: light;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --gutter: clamp(16px, 4vw, 48px);
    --ground: #f1f1ef;
    --ink: #1b1c1e;
    --body: #36383c;
    --muted: #5d6066;
    --rule: #d6d6d2;
    --rule-soft: #e4e4e0;
    --primary: #26292e;
    --on-primary: #ffb37a;
    --accent: #a8430b;
    --aging: #a8430b;
    --stale: #b42318;
    --link-rule: rgb(93 96 102 / 45%);
    --focus: #2563eb;
    --bar-now: #a8430b;
    --bar-edge: #5d6066;
    --bar-blocked: #e4e4e0;
    --hatch: rgb(27 28 30 / 28%);
    --hit: #f6e2d3;
    --fix: #2f5f28;
    --stage-wait: #a8430b;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #121417;
      --ink: #e9ecf0;
      --body: #c6cbd3;
      --muted: #9aa1ad;
      --rule: #2c3138;
      --rule-soft: #22262c;
      --primary: #8fb0ff;
      --on-primary: #0b1220;
      --accent: #f2b45a;
      --aging: #f2b45a;
      --stale: #ff8a80;
      --link-rule: rgb(154 161 173 / 45%);
      --focus: #8fb0ff;
      --bar-now: #f2b45a;
      --bar-edge: #9aa1ad;
      --bar-blocked: #22262c;
      --hatch: rgb(233 236 240 / 26%);
      --hit: #2b2418;
      --fix: #a6d492;
      --stage-wait: #f2b45a;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #121417;
    --ink: #e9ecf0;
    --body: #c6cbd3;
    --muted: #9aa1ad;
    --rule: #2c3138;
    --rule-soft: #22262c;
    --primary: #8fb0ff;
    --on-primary: #0b1220;
    --accent: #f2b45a;
    --aging: #f2b45a;
    --stale: #ff8a80;
    --link-rule: rgb(154 161 173 / 45%);
    --focus: #8fb0ff;
    --bar-now: #f2b45a;
    --bar-edge: #9aa1ad;
    --bar-blocked: #22262c;
    --hatch: rgb(233 236 240 / 26%);
    --hit: #2b2418;
    --fix: #a6d492;
    --stage-wait: #f2b45a;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
  }

  :where(.board) :where(p, h1, h2, h3, dl, dd, ol) {
    margin: 0;
  }

  :where(.board) :where(ol) {
    padding: 0;
    list-style: none;
  }

  a {
    border-bottom: 1px solid var(--link-rule);
    color: inherit;
    text-decoration: none;
  }

  a:hover {
    border-bottom-color: currentColor;
  }

  a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* "better after" and "eases" links. */
  .ref--soft {
    border-bottom-style: dashed;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .num {
    font-family: var(--mono);
    font-weight: 500;
  }

  .board {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px var(--gutter) 72px;
    display: flex;
    flex-direction: column;
    gap: 56px;
  }

  /* The same spacing as .board, for the sections inside main. */
  .board-main {
    display: flex;
    flex-direction: column;
    gap: 56px;
  }

  .board-message {
    padding: 40px var(--gutter);
    color: var(--muted);
  }

  .label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Outlined, so the Start now count stays the only filled block. */
  .badge {
    display: inline-block;
    flex: none;
    padding: 1px 5px;
    border: 1.5px solid currentColor;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1.4;
    white-space: nowrap;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    padding: 1px 7px;
    border: 1px solid var(--muted);
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.5;
  }

  .chip::before {
    content: "";
    flex: none;
    width: 6px;
    height: 6px;
    background: var(--muted);
  }

  .chip--none {
    border-style: dashed;
    color: var(--muted);
  }

  .chip--none::before {
    border: 1px solid currentColor;
    background: transparent;
  }

  .chip:hover {
    border-color: var(--ink);
    border-style: solid;
    color: var(--ink);
  }

  /* Stages, flags, and affinity, the same in backlog-triage.html and
     bugs.html; change both together. Each stage has a border form of its
     own as well as a color, so it reads in grayscale: dashed for started,
     dotted for a branch, double for a draft, solid for review, hatched for
     needs author, filled for ready to merge, and struck through for
     close-out. */
  .stage {
    display: inline-block;
    padding: 1px 6px;
    border: 1.5px solid currentColor;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1.4;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .stage--started {
    border-style: dashed;
    color: var(--muted);
  }

  .stage--branch {
    border-style: dotted;
    color: var(--body);
  }

  .stage--draft {
    padding: 0 5px;
    border-style: double;
    border-width: 3px;
    color: var(--body);
  }

  .stage--awaiting-review {
    color: var(--stage-wait);
  }

  .stage--needs-author {
    background-image: repeating-linear-gradient(
      135deg,
      transparent 0 3px,
      color-mix(in srgb, currentColor 22%, transparent) 3px 5px
    );
    color: var(--stale);
  }

  .stage--ready-to-merge {
    border-color: var(--fix);
    background: var(--fix);
    color: var(--ground);
  }

  .stage--close-out {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }

  a.stage:hover {
    border-color: currentColor;
    text-decoration: underline;
  }

  a.stage--ready-to-merge:hover {
    border-color: var(--fix);
  }

  .flags {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 4px 6px;
    vertical-align: 1px;
  }

  .flag {
    padding: 0 4px;
    border: 1px dashed currentColor;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.4;
    white-space: nowrap;
  }

  .flag--quiet {
    color: var(--stage-wait);
  }

  .flag--stale,
  .flag--conflict {
    border-style: solid;
    color: var(--stale);
  }

  .next-action {
    color: var(--body);
    font-size: 13.5px;
  }

  .affinity {
    color: var(--muted);
    font-size: 12.5px;
    overflow-wrap: anywhere;
  }

  .stage-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 22px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .stage-strip a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-bottom: none;
  }

  .stage-strip .num {
    font-size: 15px;
  }

  /* Header */
  .head {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .masthead {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px 40px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--ink);
  }

  .masthead-title {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .repo {
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    overflow-wrap: anywhere;
  }

  .repo a {
    border-bottom: none;
  }

  .when {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    text-align: right;
  }

  .when-time {
    color: var(--ink);
    font-size: 15px;
    font-weight: 500;
  }

  .when-age.is-aging {
    color: var(--aging);
  }

  .when-age.is-stale {
    color: var(--stale);
  }

  .counts {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .count {
    display: flex;
    flex-direction: column-reverse;
    justify-content: flex-end;
    gap: 6px;
    padding: 14px 16px;
    border-right: 1px solid var(--rule);
  }

  .count:last-child {
    border-right: none;
  }

  .count dt {
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .count dd {
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 600;
    line-height: 1;
  }

  .count--primary {
    border-right: none;
    background: var(--primary);
    color: var(--on-primary);
  }

  .count--primary dt {
    color: var(--on-primary);
  }

  .count--open dd {
    color: var(--muted);
  }

  .summary {
    max-width: 62ch;
    font-size: clamp(19px, 2.2vw, 23px);
    font-weight: 500;
    line-height: 1.45;
    letter-spacing: -0.01em;
    text-wrap: pretty;
  }

  /* Sections */
  .section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .section-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 16px;
  }

  .section-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .section--lead .section-title {
    font-size: 28px;
    letter-spacing: -0.02em;
    color: var(--primary);
  }

  .section--lanes .section-title,
  .section--flight .section-title {
    font-size: 24px;
    letter-spacing: -0.02em;
  }

  .section-note {
    max-width: 88ch;
    color: var(--muted);
  }

  .ruled {
    border-top: 1px solid var(--ink);
  }

  /* Start now rows */
  .start-row {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr) 300px;
    column-gap: 28px;
    row-gap: 12px;
    padding: 24px 0 26px;
    border-bottom: 1px solid var(--rule);
  }

  .start-rank {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
    color: var(--primary);
  }

  .start-main {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .start-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 10px;
    font-size: 14px;
    color: var(--muted);
  }

  .start-why {
    font-size: 21px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
    text-wrap: pretty;
  }

  .start-with {
    font-size: 14px;
    color: var(--body);
  }

  .facts {
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr);
    row-gap: 6px;
    font-size: 13px;
    align-content: start;
  }

  .facts dt {
    padding-top: 2px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .facts dd {
    min-width: 0;
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  .fact-lane {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 8px;
  }

  /* In flight */
  .flight {
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding-top: 18px;
  }

  .flight-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .flight-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: inherit;
  }

  .flight-row {
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1.2fr);
    gap: 6px 24px;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule-soft);
  }

  .flight-row:last-child {
    border-bottom: none;
  }

  .flight-issue {
    font-weight: 500;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .flight-carrier {
    font-size: 13px;
    overflow-wrap: anywhere;
  }

  .flight-next {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* Lane bars */
  .bars {
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding-top: 20px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr) 120px;
    gap: 28px;
    align-items: center;
  }

  .bar-name {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
  }

  .bar {
    display: flex;
    gap: 3px;
    height: 18px;
  }

  .seg {
    flex: 1 1 0;
  }

  .seg--now {
    background-color: var(--bar-now);
  }

  /* Outlined and hatched, so the three states read without color. */
  .seg--queued {
    box-shadow: inset 0 0 0 1.5px var(--bar-edge);
  }

  .seg--blocked {
    background-color: var(--bar-blocked);
    background-image: repeating-linear-gradient(135deg, transparent 0 3px, var(--hatch) 3px 5px);
  }

  .bar-legend {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    text-align: right;
  }

  .key {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    align-items: center;
    padding: 4px 0 8px 208px;
  }

  .key-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .key .seg {
    flex: none;
    width: 16px;
    height: 10px;
  }

  /* Lanes */
  .lane {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr);
    gap: 28px;
    padding: 24px 0 22px;
    border-top: 1px solid var(--rule);
  }

  .lanes {
    border-bottom: 1px solid var(--rule);
  }

  .lane:first-child {
    border-top: none;
  }

  .lane-title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .cap {
    margin-top: 16px;
  }

  .cap-line {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .cap-figure {
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 600;
    line-height: 1;
  }

  .cap-unit {
    width: min-content;
    min-width: 9ch;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    line-height: 1.25;
    text-transform: uppercase;
  }

  .cap-then {
    margin-top: 6px;
    color: var(--body);
    font-family: var(--mono);
    font-size: 12px;
  }

  .lane-count {
    margin-top: 14px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
  }

  .lane-owns {
    margin-top: 6px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }

  .lane-note {
    max-width: 88ch;
    margin-bottom: 14px;
    color: var(--body);
  }

  .cols,
  .item {
    display: grid;
    grid-template-columns: 32px 64px minmax(0, 1fr) 210px 220px;
    gap: 14px;
  }

  /* A board with no milestones drops the milestone column entirely. */
  @media (min-width: 801px) {
    .no-milestones .cols,
    .no-milestones .item {
      grid-template-columns: 32px 64px minmax(0, 1fr) 260px;
    }
  }

  .cols {
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .item {
    align-items: baseline;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule-soft);
  }

  .item:last-child {
    border-bottom: none;
  }

  .item-rank {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
  }

  .item-title {
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .item-title .stage {
    vertical-align: 1px;
  }

  .item-title .affinity {
    display: block;
    margin-top: 2px;
  }

  .item-deps {
    color: var(--body);
    font-size: 13px;
  }

  /* The fold: everything below is the report. */
  .fold {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .fold::before,
  .fold::after {
    content: "";
    flex: 1 1 0;
    border-top: 4px double var(--ink);
  }

  /* Contention matrix */
  .table-wrap {
    overflow-x: auto;
  }

  .matrix {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 14px;
  }

  .matrix-first {
    width: 230px;
  }

  .matrix th,
  .matrix td {
    padding: 9px 12px;
    border: 1px solid var(--rule);
    text-align: left;
    vertical-align: top;
  }

  .matrix thead th {
    border-top: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .matrix tbody th {
    font-weight: 500;
  }

  .matrix tr > :first-child {
    border-left: none;
  }

  .matrix tr > :last-child {
    border-right: none;
  }

  .matrix .hit {
    background: var(--hit);
    box-shadow: inset 3px 0 0 var(--accent);
  }

  .hit-refs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
  }

  /* Blocked */
  .blocked-cols,
  .blocked-row {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 360px 160px;
    gap: 20px;
  }

  .blocked-cols {
    padding: 10px 0 8px;
    border-bottom: 1px solid var(--rule);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .blocked-row {
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
  }

  .blocked-issue {
    font-weight: 500;
    line-height: 1.35;
  }

  .waiting {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .waiting-item {
    font-size: 14px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .waiting-title {
    color: var(--muted);
  }

  .blocked-why {
    color: var(--body);
    font-size: 14px;
  }

  .blocked-lane {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
  }

  /* Names a blocked cell's column for screen readers, and on screen once
     narrow widths hide the header row. */
  .cell-label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .footer {
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 13px;
  }

  /* Below 1080px the fixed columns leave titles and blocker names too narrow. */
  @media (max-width: 1080px) {
    .lane {
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }

    .lane-meta {

<div class="board" id="board">
  <noscript>
    <p class="board-message">This board draws itself from data embedded in the page, so it needs JavaScript to display.</p>
  </noscript>
</div>
<script type="application/json" id="board-data">
  "__BOARD_DATA__"
</script>
<script>
  // Draws the board from the JSON in #board-data. The report-board script
  // checks that JSON before writing it into this template, so the code below
  // trusts its shape. Every string from the data reaches the page through text
  // nodes and attributes, never through innerHTML, because issue titles and
  // notes come from GitHub.
  (() => {
    "use strict";

    const AGING_AFTER_DAYS = 1;
    const STALE_AFTER_DAYS = 3;
    const WORDS = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
    const NO_MILESTONE = Symbol("no milestone");

    const root = document.getElementById("board");

    // Copied from bugs.html; a fix to one prompts a look at the other.
    function h(tag, attributes, children) {
      const element = document.createElement(tag);
      for (const [name, value] of Object.entries(attributes ?? {})) {
        if (value === null || value === undefined || value === false) continue;
        if (name === "class") element.className = value;
        else element.setAttribute(name, value === true ? "" : String(value));
      }
      for (const child of [children ?? []].flat(Infinity)) {
        if (child === null || child === undefined || child === false || child === "") continue;
        element.append(child instanceof Node ? child : String(child));
      }
      return element;
    }

    let data = null;
    try {
      data = JSON.parse(document.getElementById("board-data").textContent);
    } catch {
      data = null;
    }
    if (data === null || typeof data !== "object" || !Array.isArray(data.issues)) {
      root.replaceChildren(
        h("p", { class: "board-message" }, "This page holds no board data yet. Render it with the report-board script."),
      );
      return;
    }
    // A board before schema version 2 lacks the progress fields this page
    // reads, so it asks for a sync rather than drawing work in progress as
    // absent.
    if (data.schemaVersion !== 2) {
      root.replaceChildren(
        h(
          "p",
          { class: "board-message" },
          "This page holds board data from an earlier version of publish-report-board. Sync the board again to draw it.",
        ),
      );
      return;
    }

    const word = (n) => WORDS[n] ?? String(n);
    const capitalize = (text) => text.charAt(0).toUpperCase() + text.slice(1);
    const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    const listAt = (map, key) => {
      if (!map.has(key)) map.set(key, []);
      return map.get(key);
    };

    const repoUrl = (data.repoUrl || `https://github.com/${data.repo}`).replace(/\/+$/, "");
    // An address the URL parser rejects must not stop the page, so links to
    // other repositories fall back to github.com.
    let origin = "https://github.com";
    try {
      origin = new URL(repoUrl).origin;
    } catch {
      origin = "https://github.com";
    }
    // A repository URL can carry a path prefix, as an enterprise install at
    // https://git.example.com/enterprise/owner/name does. Another repository
    // sits beside this one under that prefix, which origin alone would drop.
    const repoBase = data.repo && repoUrl.endsWith(`/${data.repo}`) ? repoUrl.slice(0, -(data.repo.length + 1)) : origin;
    // Encodes a branch name for a URL path, including "#" and "?".
    const pathPart = (text) => String(text).split("/").map(encodeURIComponent).join("/");
    const issueUrl = (n) => `${repoUrl}/issues/${n}`;
    const searchUrl = (query) => `${repoUrl}/issues?q=${encodeURIComponent(query)}`;
    // A milestone title is arbitrary text, so a quote or a backslash in one
    // would end the qualifier early and search for something else.
    const searchQuoted = (text) => `"${String(text).replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
    const milestoneUrl = (title) =>
      searchUrl(title ? `is:open milestone:${searchQuoted(title)}` : "is:open no:milestone");
    const link = (href, text) => h("a", { class: "ref", href }, text);
    const ref = (n) => h("a", { class: "ref num", href: issueUrl(n) }, `#${n}`);
    // Links "#123", and "owner/repo#123" for another repository, in a prose
    // field. A "#" inside a word, such as "C#1", stays text. Matches the linker
    // in bugs.html except that a local reference is drawn as an issue number;
    // fix the matching rules in both.
    const PROSE_REF = /([\w.-]+\/[\w.-]+)?#(\d+)(?![\w#])/g;
    const prose = (text) => {
      const source = String(text ?? "");
      const out = [];
      let last = 0;
      for (const match of source.matchAll(PROSE_REF)) {
        const before = source[match.index - 1];
        if (!match[1] && before && /[\w&]/.test(before)) continue;
        // Inside a URL, such as https://example.com/owner/repo#3, the match
        // belongs to that address rather than to this repository.
        const head = source.slice(0, match.index);
        if (/:\/\//.test(head.slice(head.search(/\S*$/)))) continue;
        // "../target#1" is not a repository reference. A browser normalizes the
        // path, so linking it would reach another repository, or climb out of a
        // repository URL that carries a path prefix.
        if (match[1] && match[1].split("/").some((part) => part === "." || part === "..")) continue;
        out.push(source.slice(last, match.index));
        out.push(match[1] ? link(`${repoBase}/${match[1]}/issues/${match[2]}`, match[0]) : ref(Number(match[2])));
        last = match.index + match[0].length;
      }
      out.push(source.slice(last));
      return out;
    };

    const issues = data.issues;
    const startNow = data.startNow ?? [];
    const notes = data.notes ?? {};
    const byNumber = new Map(issues.map((issue) => [issue.number, issue]));
    const anyMilestone = issues.some((issue) => issue.milestone);
    const waits = (n) => byNumber.get(n)?.waitingOn ?? [];
    const afters = (n) => byNumber.get(n)?.after ?? [];
    const isBlocked = (n) => waits(n).length > 0;
    const partnerOf = (n) => byNumber.get(n)?.sameBranchAs ?? null;
    const rides = (n) => partnerOf(n) !== null;
    const shortTitle = (n) => byNumber.get(n)?.short || byNumber.get(n)?.title || "";

    const unblocks = new Map();
    const eases = new Map();
    const riders = new Map();
    for (const issue of issues) {
      for (const waited of issue.waitingOn ?? []) {
        if (typeof waited === "number") listAt(unblocks, waited).push(issue.number);
      }
      for (const target of issue.after ?? []) {
        if (typeof target === "number") listAt(eases, target).push(issue.number);
      }
      if (issue.sameBranchAs != null) listAt(riders, issue.sameBranchAs).push(issue.number);
    }
    // Work in progress holds a lane slot in every stage but close-out, where
    // the pull request has merged and only closing the issue is left.
    const active = (issue) => Boolean(issue?.progress) && issue.progress.stage !== "close-out";
    // The issue carrying work in progress on the branch of n, counting any
    // issue that rides on it, or undefined.
    const progressOf = (n) => [n, ...(riders.get(n) ?? [])].find((m) => active(byNumber.get(m)));

    const laneOf = new Map();
    for (const lane of data.lanes) for (const n of lane.issues) laneOf.set(n, lane);
    const laneLabel = (lane) => `${lane.key} ${lane.name}`;
    const laneName = (lane) => [h("span", { class: "badge" }, lane.key), h("span", null, lane.name)];

    // A blocker is an open issue on this board or a reference to something else
    // that has to land first: a pull request, a branch, an issue in another
    // repository, or any linked page. `from` names where the freeing work lives.
    function blocker(b) {
      if (typeof b === "number") {
        return { link: ref(b), title: shortTitle(b), from: laneOf.has(b) ? laneLabel(laneOf.get(b)) : "" };
      }
      if (b.pr != null) {
        const href = `${repoUrl}/pull/${b.pr}`;
        return { link: h("a", { class: "ref num", href }, `PR #${b.pr}`), title: b.title, from: "a pull request" };
      }
      if (b.branch != null) {
        const href = `${repoUrl}/compare/${pathPart(data.sync.branch)}...${pathPart(b.branch)}`;
        return { link: link(href, b.branch), title: b.title, from: "a branch merge" };
      }
      if (b.ref != null) {
        const [repo, number] = b.ref.split("#");
        return { link: link(`${repoBase}/${repo}/issues/${number}`, b.ref), title: b.title, from: repo };
      }
      return { link: link(b.url, b.label), title: b.title, from: "outside the repository" };
    }

    // Capacity per lane. A serial lane runs one branch at a time: the first
    // issue in its listed order that can start. A head lane runs its head, then
    // whatever the head frees, and nothing in it starts before the head. An
    // any-order lane runs every unblocked issue at once. An issue that shares a
    // branch travels with it, and work in progress holds a serial or head
    // lane's single slot; when more than one branch there is already in
    // progress, each one shows as running, so the overlap stays visible.
    // report-board validate holds the start picks to the same rules, so the
    // two agree.
    const lanes = data.lanes.map((lane) => {
      const roots = lane.issues.filter((n) => !rides(n));
      // A branch waits in the queue while any issue on it is better after
      // another open issue, unless its work has already started.
      const queued = (n) => [n, ...(riders.get(n) ?? [])].some((m) => afters(m).some((target) => target !== n));
      const canRun = (n) => !isBlocked(n) && (!queued(n) || progressOf(n) !== undefined);
      const first = lane.issues[0];
      const head = lane.mode === "head" ? (rides(first) ? partnerOf(first) : first) : null;
      const held = roots.filter((n) => progressOf(n) !== undefined);
      let running = [];
      // A branch already in progress is running whether or not its issue is
      // blocked, the same as in a serial or head lane. state() still draws that
      // issue as blocked, so the bar and the row stay truthful.
      if (lane.mode === "any") running = roots.filter((n) => canRun(n) || progressOf(n) !== undefined);
      // A branch already in progress holds the slot even when its issue is
      // blocked, so the lane still cannot start another one. state() draws that
      // issue as blocked regardless, so the bar and the row stay truthful.
      else if (held.length) running = held;
      else {
        const next = lane.mode === "head" ? head : roots.find(canRun);
        if (next != null && canRun(next)) running = [next];
      }
      // A rider stays out of the running set while it has a blocker of its own,
      // or is better after something that has not landed, unless its own work
      // has started.
      const now = new Set(
        running.flatMap((n) => [
          n,
          ...(riders.get(n) ?? []).filter(
            (r) => !isBlocked(r) && (afters(r).every((target) => target === n) || active(byNumber.get(r))),
          ),
        ]),
      );
      const headUnit = lane.mode === "head" ? new Set([head, ...(riders.get(head) ?? [])]) : new Set();
      // Rows and ranks draw the whole head unit, but only the riders that
      // travel with the head finish alongside it. A rider held back by its own
      // blocker frees nothing, so it cannot count toward what the head unlocks.
      // This is the rule that admits a rider to the running set.
      const freeingUnit =
        lane.mode === "head" && head != null
          ? new Set([
              head,
              ...(riders.get(head) ?? []).filter(
                (r) => !isBlocked(r) && (afters(r).every((target) => target === head) || active(byNumber.get(r))),
              ),
            ])
          : new Set();
      // A head that is not the running branch frees nothing yet, so the lane
      // counts zero rather than promising what the head would unlock. A branch
      // already in progress holds the slot, and the head is running only when
      // it is that branch. Another branch already in progress beside the head
      // is running now, so the head landing frees nothing there.
      const freedAfter =
        lane.mode === "head" && head != null && running.includes(head)
          ? lane.issues.filter(
              (n) =>
                !headUnit.has(n) &&
                !rides(n) &&
                !running.includes(n) &&
                waits(n).every((b) => freeingUnit.has(b)) &&
                afters(n).every((b) => freeingUnit.has(b)),
            ).length
          : 0;
      const ranks = new Map();
      if (lane.mode === "serial") {
        let step = 0;
        for (const n of lane.issues) {
          if (!(rides(n) && lane.issues.includes(partnerOf(n)))) ranks.set(n, String(++step));
        }
        for (const n of lane.issues) if (!ranks.has(n)) ranks.set(n, ranks.get(partnerOf(n)) ?? "·");
      } else {
        for (const n of lane.issues) ranks.set(n, headUnit.has(n) ? "1" : "·");
      }
      const state = (n) => (isBlocked(n) ? "blocked" : now.has(n) ? "now" : "queued");
      return {
        lane,
        running,
        cap: running.length,
        freedAfter,
        ranks,
        state,
        blocked: lane.issues.filter(isBlocked).length,
      };
    });

    function tokens(parts) {
      const out = [];
      for (const [label, entries, soft] of parts) {
        if (!entries.length) continue;
        if (out.length) out.push(" · ");
        out.push(`${label} `);
        entries.forEach((entry, index) => {
          if (index) out.push(", ");
          const node = typeof entry === "number" ? ref(entry) : blocker(entry).link;
          if (soft) node.classList.add("ref--soft");
          out.push(node);
        });
      }
      return out;
    }

    function chip(milestone) {
      return milestone
        ? h("a", { class: "chip", href: milestoneUrl(milestone) }, milestone)
        : h("a", { class: "chip chip--none", href: milestoneUrl(null) }, "No milestone");
    }

    // Stages, flags, and affinity, drawn from the progress and affinity a
    // gather script derived. The same in backlog-triage.html and bugs.html;
    // fix both together. STAGES follows the order of the progress model.
    const STAGES = [
      ["started", "Started"],
      ["branch", "Branch"],
      ["draft", "Draft"],
      ["awaiting-review", "Awaiting review"],
      ["needs-author", "Needs author"],
      ["ready-to-merge", "Ready to merge"],
      ["close-out", "Close-out"],
    ];
    const STAGE_LABEL = new Map(STAGES);
    const FLAG_TEXT = {
      quiet: ["quiet", "No activity for longer than the quiet period, 7 days by default"],
      stale: ["stale", "No activity for longer than the stale period, 30 days by default; resume or drop it"],
      behind: ["behind", "The branch is behind the default branch"],
      conflict: ["conflict", "The pull request conflicts with its base"],
      multiple: ["several", "More than one branch or pull request carries this issue"],
      local: ["local", "The branch exists only on the machine that synced"],
      "leftover-label": ["label left", "The progress label is still on the issue"],
    };
    const MOVE_TEXT = { reviewer: "a reviewer moves next", ci: "CI moves next", nobody: "nobody is asked to review" };
    const IGNORED_TEXT = {
      assigned: "assignment",
      claimed: "claims",
      filed: "who filed",
      commented: "comments",
      active: "active work",
      recent: "recent work",
    };
    const hidden = (text) => h("span", { class: "visually-hidden" }, text);

    function carrierText(carrier) {
      if (carrier?.pr != null) return `PR #${carrier.pr}`;
      if (carrier?.branch != null) return carrier.branch;
      if (carrier?.label != null) return `the ${carrier.label} label`;
      if (carrier?.pipeline != null) return `the ${carrier.pipeline} pipeline`;
      return "";
    }

    // A pull request links to itself, and a branch to its comparison with the
    // synced branch. A label or a pipeline stays text.
    function carrierHref(carrier) {
      if (carrier?.pr != null) return `${repoUrl}/pull/${carrier.pr}`;
      if (carrier?.branch != null) return `${repoUrl}/compare/${pathPart(data.sync.branch)}...${pathPart(carrier.branch)}`;
      return null;
    }

    function carrierLink(carrier) {
      const href = carrierHref(carrier);
      return href ? h("a", { class: "num", href }, carrierText(carrier)) : h("span", null, carrierText(carrier));
    }

    function stageTag(progress) {
      const label = STAGE_LABEL.get(progress.stage) ?? progress.stage;
      const href = carrierHref(progress.carrier);
      return h(
        href ? "a" : "span",
        { class: `stage stage--${progress.stage}`, href, title: `${label}: ${progress.signal}` },
        [label, hidden(` on ${carrierText(progress.carrier)}`)],
      );
    }

    // Only the flags in `only`, when given, so a compact row can show just the
    // ones that explain a held lane slot.
    function flagMarks(progress, only) {
      const shown = (progress.flags ?? []).filter((flag) => !only || only.includes(flag));
      if (!shown.length) return null;
      return h(
        "span",
        { class: "flags" },
        shown.map((flag) => {
          const [text, title] = FLAG_TEXT[flag] ?? [flag, flag];
          const where = flag === "local" && progress.host ? `, on ${progress.host}` : "";
          return h("span", { class: `flag flag--${flag}`, title: `${title}${where}` }, [hidden("Flag: "), text]);
        }),
      );
    }

    // Whole days between the last activity and the sync, so the page says the
    // same thing however long after the sync it is read.
    function idleDays(progress) {
      const last = new Date(progress.lastActivity);
      if (!validTime || Number.isNaN(last.getTime())) return null;
      return Math.max(0, Math.floor((syncedAt.getTime() - last.getTime()) / 86400000));
    }

    function nextText(progress) {
      const move = progress.nextMove === "author" ? "" : MOVE_TEXT[progress.nextMove];
      const idle = idleDays(progress);
      return [
        h("span", { class: "label" }, "Next "),
        progress.nextAction,
        move ? ` · ${move}` : "",
        idle ? ` · idle ${count(idle, "day", "days")}` : "",
      ];
    }

    function ownerText(owner) {
      if (owner === "you") return "You";
      if (owner === "unknown") return "Claimed, owner unknown";
      return `@${owner}`;
    }

    function affinityNote(affinity, tag = "p") {
      if (!affinity?.owner) return null;
      const who = ownerText(affinity.owner);
      const reasons = affinity.reasons ?? [];
      return h(tag, { class: "affinity" }, [hidden("Affinity: "), who, reasons.length ? ` · ${reasons.join(", ")}` : ""]);
    }

    // The ignored signal kinds, as a sentence for the footer.
    function ignoredNote() {
      const kinds = (data.affinityIgnored ?? []).map((kind) => IGNORED_TEXT[kind] ?? kind);
      if (!kinds.length) return "";
      return ` Affinity ignores ${kinds.join(", ")} here, because one owner holds them on nearly every open issue.`;
    }

    // One link per stage that has work, in model order. `hrefFor` names where
    // the link goes.
    function stageStrip(progressList, hrefFor) {
      const counts = new Map();
      for (const progress of progressList) counts.set(progress.stage, (counts.get(progress.stage) ?? 0) + 1);
      const present = STAGES.filter(([key]) => counts.has(key));
      if (!present.length) return null;
      return h(
        "ul",
        { class: "stage-strip", "aria-label": "Work by stage" },
        present.map(([key, label]) =>
          h(
            "li",
            null,
            h("a", { href: hrefFor(key) }, [
              h("span", { class: `stage stage--${key}` }, label),
              h("span", { class: "num" }, String(counts.get(key))),
            ]),
          ),
        ),
      );
    }

    function section(id, kind, title, note, body) {
      return h("section", { class: `section section--${kind}`, id, "aria-labelledby": `${id}-heading` }, [
        h("div", { class: "section-head" }, [
          h("h2", { class: "section-title", id: `${id}-heading` }, title),
          note ? h("p", { class: "section-note" }, prose(note)) : null,
        ]),
        body,
      ]);
    }

    // Header
    const syncedAt = new Date(data.sync.at);
    // A time no calendar has, such as 24:30, shows as written and gets no age,
    // rather than stopping the page.
    const validTime = !Number.isNaN(syncedAt.getTime());
    // A zone the browser does not know falls back to UTC, which the time line
    // then names, so every viewer still sees the same time. The same in
    // bugs.html; fix both together.
    function formatSync(locale, options) {
      if (!validTime) return "";
      try {
        return new Intl.DateTimeFormat(locale, { ...options, timeZone: data.sync.timeZone || undefined }).format(syncedAt);
      } catch {
        return new Intl.DateTimeFormat(locale, { ...options, timeZone: "UTC" }).format(syncedAt);
      }
    }
    const dateText = validTime ? formatSync("en-GB", { day: "numeric", month: "short", year: "numeric" }) : data.sync.at;
    const timeText = formatSync("en-US", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZoneName: "short" });
    const syncText = [dateText, timeText].filter(Boolean).join(", ");
    const branchLink = () => link(`${repoUrl}/tree/${pathPart(data.sync.branch)}`, data.sync.branch);
    const commitLink = () => link(`${repoUrl}/commit/${data.sync.commit}`, data.sync.commit.slice(0, 8));

    const age = h("p", { class: "when-age" });
    // Counts whole units, so it never says "1 day ago" before the color
    // changes. bugs.html shares this wording; fix both together.
    function refreshAge() {
      if (!validTime) return;
      const minutes = Math.max(0, Math.floor((Date.now() - syncedAt.getTime()) / 60000));
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);
      let text = "Synced just now";
      if (days >= 1) text = `Synced ${count(days, "day", "days")} ago`;
      else if (hours >= 1) text = `Synced ${count(hours, "hour", "hours")} ago`;
      else if (minutes >= 1) text = `Synced ${count(minutes, "minute", "minutes")} ago`;
      age.textContent = text;
      age.classList.toggle("is-aging", days >= AGING_AFTER_DAYS && days < STALE_AFTER_DAYS);
      age.classList.toggle("is-stale", days >= STALE_AFTER_DAYS);
    }
    refreshAge();
    window.setInterval(refreshAge, 60000);

    const blockedCount = issues.filter((issue) => isBlocked(issue.number)).length;
    const inFlight = issues.filter((issue) => issue.progress);
    const runningCapacity = lanes.reduce((sum, model) => sum + model.cap, 0);
    // Each label is its own element, so a noun label must agree with its count.
    const counts = [
      [startNow.length, "Start now", "count--primary"],
      [issues.length - blockedCount, "Ready"],
      [blockedCount, "Blocked"],
      [data.lanes.length, data.lanes.length === 1 ? "Lane open" : "Lanes open"],
      [runningCapacity, runningCapacity === 1 ? "Branch at once" : "Branches at once"],
      [issues.length, "Open", "count--open"],
    ];

    const [owner, name = data.repo] = String(data.repo ?? "").split("/");
    const header = h("header", { class: "head" }, [
      h("div", { class: "masthead" }, [
        h("div", { class: "masthead-title" }, [
          h("p", { class: "label" }, owner ? `Backlog triage · ${owner}` : "Backlog triage"),
          h("h1", { class: "repo" }, link(repoUrl, name)),
        ]),
        h("div", { class: "when" }, [
          h("time", { class: "when-time", datetime: data.sync.at }, syncText),
          h("p", null, [branchLink(), " @ ", commitLink()]),
          age,
        ]),
      ]),
      h(
        "dl",
        { class: "counts" },
        counts.map(([value, label, modifier]) =>
          h("div", { class: modifier ? `count ${modifier}` : "count" }, [h("dt", null, label), h("dd", null, String(value))]),
        ),
      ),
      stageStrip(
        inFlight.map((issue) => issue.progress),
        (stage) => `#in-flight-${stage}`,
      ),
      h("p", { class: "summary" }, prose(data.summary)),
    ]);

    // In flight: every issue with work under way or left to close, grouped by
    // stage in model order. Lanes keep these issues in place as well, because
    // their order and capacity depend on them.
    function flightRow(issue) {
      const progress = issue.progress;
      const extra = progress.extraCarriers ?? [];
      return h("li", { class: "flight-row" }, [
        h("p", { class: "flight-issue" }, [ref(issue.number), " ", shortTitle(issue.number)]),
        h("p", { class: "flight-carrier" }, [
          carrierLink(progress.carrier),
          extra.length ? [" + ", extra.map((carrier, i) => [i ? ", " : "", carrierLink(carrier)])] : null,
          " ",
          flagMarks(progress),
        ]),
        h("div", { class: "flight-next" }, [h("p", { class: "next-action" }, nextText(progress)), affinityNote(issue.affinity)]),
      ]);
    }

    // Closest to done first, as the bugs board orders Ready to go, with
    // close-out last because it is cleanup rather than work.
    const FLIGHT_ORDER = ["ready-to-merge", "needs-author", "awaiting-review", "draft", "branch", "started", "close-out"];
    const flightGroups = FLIGHT_ORDER.map((key) => [key, STAGE_LABEL.get(key), inFlight.filter((issue) => issue.progress.stage === key)]).filter(
      ([, , members]) => members.length,
    );
    const flightNote = inFlight.length
      ? `${capitalize(word(inFlight.length))} ${inFlight.length === 1 ? "issue has" : "issues have"} work under way or left to close, grouped by how far along it is.`
      : "No work is under way.";
    const flightSection = section(
      "in-flight",
      "flight",
      "In flight",
      flightNote,
      flightGroups.length
        ? h(
            "div",
            { class: "flight ruled" },
            flightGroups.map(([key, label, members]) =>
              h("div", { class: "flight-group", id: `in-flight-${key}` }, [
                h("h3", { class: "flight-head" }, [
                  h("span", { class: `stage stage--${key}` }, label),
                  h("span", { class: "label" }, count(members.length, "issue", "issues")),
                ]),
                h("ol", { class: "flight-list", role: "list" }, members.map(flightRow)),
              ]),
            ),
          )
        : null,
    );

    // Start now
    function startRow(pick, index) {
      const n = pick.issue;
      const issue = byNumber.get(n);
      const lane = laneOf.get(n);
      const companions = riders.get(n) ?? [];
      return h("li", { class: "start-row" }, [
        h("p", { class: "start-rank", "aria-hidden": "true" }, String(index + 1).padStart(2, "0")),
        h("div", { class: "start-main" }, [
          h("p", { class: "start-line" }, [ref(n), h("span", null, shortTitle(n))]),
          h("p", { class: "start-why" }, prose(pick.why)),
          companions.length ? h("p", { class: "start-with" }, tokens([["Shares a branch with", companions]])) : null,
        ]),
        h("dl", { class: "start-side facts" }, [
          h("dt", null, "Lane"),
          h("dd", { class: "fact-lane" }, laneName(lane)),
          pick.touches ? [h("dt", null, "Touches"), h("dd", null, pick.touches)] : null,
          anyMilestone ? [h("dt", null, "Milestone"), h("dd", null, chip(issue.milestone))] : null,
          issue.affinity?.owner
            ? [
                h("dt", null, "Affinity"),
                h("dd", null, [affinityNote(issue.affinity, "span"), pick.despiteOwner ? h("p", null, prose(pick.despiteOwner)) : null]),
              ]
            : null,
        ]),
      ]);
    }

    // With no picks the section keeps one line, which says whether anything
    // could have started.
    // The note keys off the same state() the lane rows use, so it cannot
    // contradict a row beside it. A rider joins the running unit whether or not
    // its own work has started, so a lane whose root is in progress can still
    // draw a rider as able to run now while running holds only that root.
    // Progress is read on the branch a rider travels with, because riders maps
    // a root to its riders and never the reverse, so a rider on its own
    // reports no progress even while its branch is running.
    const idle = lanes.some((model) =>
      model.lane.issues.some((n) => model.state(n) === "now" && progressOf(rides(n) ? partnerOf(n) : n) === undefined),
    );
    const emptyStartNote = idle
      ? "No branches picked."
      : "Nothing can start: every issue is blocked, queued behind another, or already in progress.";
    const startNote =
      notes.startNow ||
      (startNow.length
        ? `${capitalize(word(startNow.length))} ${startNow.length === 1 ? "branch" : "branches"} to open, most valuable first.`
        : emptyStartNote);
    const startSection = section(
      "start-now",
      "lead",
      "Start now",
      startNote,
      startNow.length ? h("ol", { class: "start ruled", role: "list" }, startNow.map(startRow)) : null,
    );

    // Lanes
    function barRow(model) {
      const { lane } = model;
      const states = lane.issues.map(model.state);
      const tally = (state) => states.filter((value) => value === state).length;
      return h("div", { class: "bar-row" }, [
        h("p", { class: "bar-name" }, laneName(lane)),
        h(
          "div",
          {
            class: "bar",
            role: "img",
            "aria-label": `${laneLabel(lane)}: ${tally("now")} can run now, ${tally("queued")} queued, ${tally("blocked")} blocked`,
          },
          states.map((state) => h("span", { class: `seg seg--${state}` })),
        ),
        h("p", { class: "bar-legend" }, `${tally("now")} of ${count(states.length, "issue", "issues")}`),
      ]);
    }

    function laneItem(n, model) {
      const issue = byNumber.get(n);
      const partner = partnerOf(n);
      const rank = model.ranks.get(n);
      const deps = tokens([
        ["same branch as", partner === null ? [] : [partner]],
        ["waits on", waits(n)],
        ["better after", afters(n), true],
        ["unblocks", unblocks.get(n) ?? []],
        ["eases", eases.get(n) ?? [], true],
      ]);
      // The column headings are drawn for sighted readers only, so each field
      // carries a visually hidden label; the title reads as part of "Issue #N".
      // The bar's label gives only tallies, so each row states its own state.
      const stateWord = { now: "can run now", queued: "queued", blocked: "blocked" }[model.state(n)] ?? "";
      return h("li", { class: "item" }, [
        h("span", { class: "item-rank", "aria-hidden": rank === "·" ? "true" : null }, [hidden("Step "), rank]),
        h("span", { class: "item-num" }, [hidden("Issue "), ref(n), stateWord ? hidden(`, ${stateWord}.`) : null]),
        h("span", { class: "item-title" }, [
          issue.title,
          issue.progress ? [" ", stageTag(issue.progress), " ", flagMarks(issue.progress, ["quiet", "stale"])] : null,
          affinityNote(issue.affinity, "span"),
        ]),
        anyMilestone ? h("span", { class: "item-ms" }, [hidden("Milestone: "), chip(issue.milestone)]) : null,
        h("span", { class: "item-deps" }, deps.length ? [hidden("Dependencies: "), ...deps] : deps),
      ]);
    }

    function laneBlock(model) {
      const { lane } = model;
      const unit =
        lane.mode === "any"
          ? model.cap === 1
            ? "branch at once"
            : "branches at once"
          : model.cap === 1
            ? "branch at a time"
            : "branches at a time";
      const then =
        lane.mode === "head" && model.freedAfter > 0
          ? model.freedAfter === 1
            ? "then one more"
            : `then ${word(model.freedAfter)} at once`
          : "";
      return h("li", { class: "lane" }, [
        h("div", { class: "lane-meta" }, [
          h("h3", { class: "lane-title" }, laneName(lane)),
          h("div", { class: "cap" }, [
            h("p", { class: "cap-line" }, [
              h("span", { class: "cap-figure" }, String(model.cap)),
              h("span", { class: "cap-unit" }, unit),
            ]),
            then ? h("p", { class: "cap-then" }, then) : null,
          ]),
          h("div", { class: "lane-facts" }, [
            h("p", { class: "lane-count" }, `${count(lane.issues.length, "issue", "issues")} · ${model.blocked} blocked`),
            lane.owns ? h("p", { class: "lane-owns" }, lane.owns) : null,
          ]),
        ]),
        h("div", null, [
          lane.note ? h("p", { class: "lane-note" }, prose(lane.note)) : null,
          h(
            "div",
            { class: "cols", "aria-hidden": "true" },
            ["#", "Issue", "Title", anyMilestone ? "Milestone" : null, "Dependency"]
              .filter(Boolean)
              .map((label) => h("span", null, label)),
          ),
          h(
            "ol",
            { class: "items", role: "list" },
            lane.issues.map((n) => laneItem(n, model)),
          ),
        ]),
      ]);
    }

    const keyItem = (state, label) =>
      h("span", { class: "key-item" }, [h("span", { class: `seg seg--${state}` }), label]);
    const lanesSection = section(
      "lanes",
      "lanes",
      "Lanes",
      "Each lane's order is the order to work in, and anything that waits across lanes is linked in its row. One segment per issue: how many can run at once, against what is queued behind them.",
      [
        h("div", { class: "bars" }, lanes.map(barRow)),
        h("div", { class: "key label", "aria-hidden": "true" }, [
          keyItem("now", "can run now"),
          keyItem("queued", "queued behind it"),
          keyItem("blocked", "blocked"),
        ]),
        h("ol", { class: "lanes ruled", role: "list" }, lanes.map(laneBlock)),
      ],
    );

    // Contention matrix: shared components down the side, milestones across.
    const claims = data.contention?.claims ?? [];
    const rowLabel = data.contention?.rowLabel || "Plugin";
    const milestoneKey = (n) => byNumber.get(n)?.milestone || NO_MILESTONE;
    const listed = (data.milestones ?? []).map((milestone) => milestone.title);
    const shortName = new Map((data.milestones ?? []).map((milestone) => [milestone.title, milestone.short || milestone.title]));
    const seen = [];
    for (const claim of claims) {
      for (const n of claim.issues) if (!seen.includes(milestoneKey(n))) seen.push(milestoneKey(n));
    }
    const position = (key) =>
      key === NO_MILESTONE ? Number.MAX_SAFE_INTEGER : listed.includes(key) ? listed.indexOf(key) : listed.length + seen.indexOf(key);
    const columns = [...seen].sort((a, b) => position(a) - position(b));
    const anyClaimMilestone = columns.some((key) => key !== NO_MILESTONE);

    function contentionNote() {
      if (notes.contention) return notes.contention;
      const across = claims.filter((claim) => new Set(claim.issues.map(milestoneKey)).size > 1).length;
      const within = claims.length - across;
      // The row label is arbitrary text, so it modifies "row" rather than
      // being pluralized itself: no short rule turns every noun a board might
      // use into a correct plural, and "Analysis" alone defeats the usual one.
      const lead = `${capitalize(word(claims.length))} ${rowLabel} ${claims.length === 1 ? "row is" : "rows are"} claimed by more than one issue`;
      let split = anyClaimMilestone ? ", each within one milestone." : ".";
      if (across && within) split = `: ${word(across)} across milestones, ${word(within)} within one.`;
      else if (across) split = claims.length === 1 ? ", across milestones." : ", all across milestones.";
      return `${lead}${split} A filled cell is a rebase waiting to happen, and ${rowLabel.toLowerCase()} names link to every open issue that mentions them.`;
    }

    const matrixSection = claims.length
      ? section(
          "contention",
          "report",
          "Contention matrix",
          contentionNote(),
          h(
            "div",
            { class: "table-wrap ruled" },
            h("table", { class: "matrix", style: `min-width: ${230 + columns.length * 92}px` }, [
              h("colgroup", null, [h("col", { class: "matrix-first" }), columns.map(() => h("col"))]),
              h(
                "thead",
                null,
                h("tr", null, [
                  h("th", { scope: "col" }, anyClaimMilestone ? `${rowLabel} \\ milestone` : rowLabel),
                  columns.map((key) =>
                    key === NO_MILESTONE
                      ? h("th", { scope: "col" }, anyClaimMilestone ? "No milestone" : "Claimed by")
                      : h("th", { scope: "col", title: key }, link(milestoneUrl(key), shortName.get(key) ?? key)),
                  ),
                ]),
              ),
              h(
                "tbody",
                null,
                claims.map((claim) =>
                  h("tr", null, [
                    h("th", { scope: "row" }, link(searchUrl(claim.query || `is:open ${claim.name}`), claim.name)),
                    columns.map((key) => {
                      const hits = claim.issues.filter((n) => milestoneKey(n) === key);
                      return hits.length ? h("td", { class: "hit" }, h("div", { class: "hit-refs" }, hits.map(ref))) : h("td");
                    }),
                  ]),
                ),
              ),
            ]),
          ),
        )
      : null;

    // Blocked
    const blockedIssues = issues
      .filter((issue) => isBlocked(issue.number))
      .sort((a, b) => a.waitingOn.length - b.waitingOn.length || a.number - b.number);

    function blockedRow(issue) {
      const refs = issue.waitingOn.map(blocker);
      const freeing = [...new Set(refs.map((r) => r.from).filter(Boolean))];
      const label = (text) => h("span", { class: "cell-label" }, text);
      return h("li", { class: "blocked-row" }, [
        h("p", { class: "blocked-issue" }, [ref(issue.number), " ", shortTitle(issue.number)]),
        h("div", { class: "waiting" }, [
          label("Waiting on"),
          refs.map((r) =>
            h("p", { class: "waiting-item" }, [
              r.link,
              r.title ? [" ", h("span", { class: "waiting-title" }, r.title)] : null,
            ]),
          ),
        ]),
        h("p", { class: "blocked-why" }, [label("Why it cannot start"), prose(issue.blockedBecause)]),
        h("p", { class: "blocked-lane" }, [label("Freed from"), freeing.join(" + ")]),
      ]);
    }

    const blockedNote =
      notes.blocked ||
      `${capitalize(word(blockedIssues.length))} ${blockedIssues.length === 1 ? "issue waits" : "issues wait"} on other open work.`;
    const blockedSection = blockedIssues.length
      ? section("blocked", "report", "Blocked", blockedNote, [
          h(
            "div",
            { class: "blocked-cols ruled", "aria-hidden": "true" },
            ["Issue", "Waiting on", "Why it cannot start", "Freed from"].map((label) => h("span", null, label)),
          ),
          h("ol", { class: "blocked-list", role: "list" }, blockedIssues.map(blockedRow)),
        ])
      : // With nothing blocked the section keeps one line, so an empty result
        // reads as a finding rather than as a missing section.
        section("blocked", "report", "Blocked", notes.blocked || "Nothing is blocked.", null);

    // Sync footer: when, against what, and how much.
    const milestoneCount = new Set(issues.map((issue) => issue.milestone).filter(Boolean)).size;
    const withoutMilestone = issues.filter((issue) => !issue.milestone).length;
    const footer = h("footer", { class: "footer" }, [
      "Synced ",
      syncText,
      " against ",
      branchLink(),
      " at ",
      commitLink(),
      ". ",
      milestoneCount
        ? [
            `${count(issues.length, "open issue", "open issues")} across `,
            link(`${repoUrl}/milestones`, count(milestoneCount, "milestone", "milestones")),
            withoutMilestone ? `, ${withoutMilestone} without one` : "",
          ]
        : `${count(issues.length, "open issue", "open issues")}, none in a milestone`,
      typeof data.sync.openPullRequests === "number"
        ? `, ${count(data.sync.openPullRequests, "open PR", "open PRs")}`
        : "",
      (data.sync.extra ?? []).map((fact) => `, ${fact}`),
      ".",
      ignoredNote(),
      " Re-run publish-report-board after any issue, milestone, pull request, branch, or worktree change. GitHub and the repository are the source of truth; this page is a snapshot.",
    ]);

    root.classList.toggle("no-milestones", !anyMilestone);
    // h() skips absent (null) sections.
    root.replaceChildren(
      header,
      h("main", { class: "board-main" }, [
        flightSection,
        startSection,
        lanesSection,
        h("p", { class: "fold label", role: "separator", "aria-label": "Report" }, "Report"),
        matrixSection,
        blockedSection,
      ]),
      footer,
    );
  })();
</script>
