# One page of a repository's branches, in name order, for the branch stage
# of the progress model. gh api graphql --paginate supplies $endCursor; the
# gather reads every page, so the order only needs to be stable.
query ($owner: String!, $name: String!, $endCursor: String) {
  repository(owner: $owner, name: $name) {
    refs(refPrefix: "refs/heads/", first: 100, after: $endCursor, orderBy: { field: ALPHABETICAL, direction: ASC }) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        name
        target {
          ... on Commit {
            committedDate
          }
        }
      }
    }
  }
}
